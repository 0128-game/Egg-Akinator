<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>8-BIT EGG TREE ARCHIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        :root {
            --bg-color: #000022;
            --line-color: #ffffff;
            --node-bg: #444;
            --accent: #ffff00;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'DotGothic16', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: auto;
        }

        h1 {
            color: var(--accent);
            text-shadow: 4px 4px #aa0000;
            font-size: 24px;
            margin-bottom: 40px;
            border: 4px solid #fff;
            padding: 10px 20px;
            background: #000;
        }

        /* ツリー全体のコンテナ（左から右へ） */
        .tree {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .tree ul {
            padding-left: 40px;
            position: relative;
            transition: all 0.5s;
            list-style: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 横の枝線 */
        .tree li {
            position: relative;
            padding: 10px 0;
            display: flex;
            align-items: center;
        }

        .tree li::before {
            content: '';
            position: absolute;
            left: -40px;
            top: 50%;
            border-top: 4px solid var(--line-color);
            width: 40px;
        }

        /* 縦の枝線 */
        .tree li::after {
            content: '';
            position: absolute;
            left: -40px;
            top: 0;
            border-left: 4px solid var(--line-color);
            height: 100%;
        }

        .tree li:first-child::after { height: 50%; top: 50%; }
        .tree li:last-child::after { height: 50%; }
        .tree li:only-child::after { display: none; }

        /* ノードのデザイン（8bitボタン風） */
        .node {
            background: var(--node-bg);
            border: 4px solid #fff;
            padding: 8px 16px;
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            display: inline-block;
            white-space: nowrap;
            position: relative;
            z-index: 1;
            box-shadow: 4px 4px 0px #000;
            cursor: pointer;
        }

        .node:hover {
            background: var(--accent);
            color: #000;
        }

        /* 最終結果（リザルトノード） */
        .result {
            border-color: #00ff00;
            color: #00ff00;
            font-weight: bold;
        }

        .result::after {
            content: ' [OK]';
            font-size: 10px;
        }

        /* ルート要素（たまご）は線を消す */
        .tree > ul { padding-left: 0; }
        .tree > ul > li::before, .tree > ul > li::after { display: none; }

        .info-panel {
            margin-top: 30px;
            border: 2px dashed var(--accent);
            padding: 15px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <h1>EGG RECIPE TREE</h1>

    <div class="tree" id="tree-root">
        <ul>
            <li>
                <div class="node" onclick="show('起源の食材')">たまご</div>
                <ul>
                    <li>
                        <div class="node" onclick="show('殻のまま加熱')">割らない</div>
                        <ul>
                            <li>
                                <div class="node" onclick="show('水で煮る')">ゆでる</div>
                                <ul>
                                    <li><div class="node result" onclick="show('とろとろ')">温泉卵</div></li>
                                    <li><div class="node result" onclick="show('しっかり')">ゆで卵</div></li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                    <li>
                        <div class="node" onclick="show('中身を取り出す')">割る</div>
                        <ul>
                            <li>
                                <div class="node" onclick="show('形状を保つ')">混ぜない</div>
                                <ul>
                                    <li><div class="node result" onclick="show('フライパン')">目玉焼き</div></li>
                                    <li><div class="node result" onclick="show('お湯へ')">ポーチドエッグ</div></li>
                                    <li><div class="node result" onclick="show('油で')">フライドエッグ</div></li>
                                </ul>
                            </li>
                            <li>
                                <div class="node" onclick="show('撹拌する')">混ぜる</div>
                                <ul>
                                    <li>
                                        <div class="node">焼く</div>
                                        <ul>
                                            <li><div class="node result">卵焼き</div></li>
                                            <li><div class="node result">オムレツ</div></li>
                                        </ul>
                                    </li>
                                    <li><div class="node result">茶碗蒸し</div></li>
                                    <li><div class="node result">親子丼</div></li>
                                    <li><div class="node result">卵かけご飯</div></li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </div>

    <div class="info-panel">
        <div id="msg">ノードを選択してください...</div>
    </div>

    <script>
        function show(txt) {
            document.getElementById('msg').innerText = "SYSTEM: " + txt + " を選択中...";
        }
    </script>
</body>
</html>
