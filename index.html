<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>8-BIT EGG TREE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        :root {
            --pixel-size: 4px;
            --bg-color: #000033;
            --main-color: #ffffff;
            --accent-color: #ffff00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'DotGothic16', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            margin: 0;
            image-rendering: pixelated;
        }

        /* 8bit風の枠線 */
        .pixel-border {
            border: var(--pixel-size) solid var(--main-color);
            padding: 20px;
            background: #000;
            box-shadow: 8px 8px 0px #555;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: var(--accent-color);
            text-shadow: 4px 4px #aa0000;
            margin-bottom: 30px;
        }

        /* 樹形図（ツリー）の視覚表現 */
        .tree-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .node-parent {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .node-current {
            font-size: 20px;
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 2px dashed #fff;
        }

        .tree-branch {
            font-size: 24px;
            margin: -10px 0 10px 0;
            color: var(--accent-color);
        }

        /* 選択ボタン */
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            background: #000;
            color: #fff;
            border: var(--pixel-size) solid #fff;
            padding: 10px 20px;
            font-family: 'DotGothic16', sans-serif;
            font-size: 16px;
            cursor: pointer;
            position: relative;
        }

        button:hover {
            background: var(--accent-color);
            color: #000;
        }

        button::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 2px solid #000;
            pointer-events: none;
        }

        .result-box {
            font-size: 28px;
            color: #00ff00;
            animation: blink 0.5s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>EGG SELECTOR ver 1.0</h1>

    <div class="pixel-border">
        <div id="game-ui">
            <div class="tree-container">
                <div id="parent-text" class="node-parent"></div>
                <div id="current-text" class="node-current">たまご</div>
                <div class="tree-branch">▼</div>
            </div>

            <div id="action-area">
                <div class="options" id="options-buttons">
                    </div>
            </div>
        </div>
    </div>

<script>
    const data = {
        name: "たまご",
        children: [
            {
                name: "割らない",
                children: [
                    {
                        name: "ゆでる",
                        children: [
                            { name: "温泉卵", result: true },
                            { name: "ゆで卵", result: true }
                        ]
                    }
                ]
            },
            {
                name: "割る",
                children: [
                    {
                        name: "混ぜない",
                        children: [
                            { name: "焼く", children: [{name: "目玉焼き", result: true}] },
                            { name: "ゆでる", children: [{name: "ポーチドエッグ", result: true}] },
                            { name: "揚げる", children: [{name: "フライドエッグ", result: true}] }
                        ]
                    },
                    {
                        name: "混ぜる",
                        children: [
                            { name: "焼く", children: [{name: "卵焼き", result: true}] },
                            { name: "蒸す", children: [{name: "茶碗蒸し", result: true}] },
                            { name: "煮る・汁物", children: [{name: "親子丼", result: true}] },
                            { name: "生で使う", children: [{name: "卵かけご飯", result: true}] }
                        ]
                    }
                ]
            }
        ]
    };

    let history = [];

    function updateUI(currentNode) {
        const parentText = document.getElementById('parent-text');
        const currentText = document.getElementById('current-text');
        const optionsButtons = document.getElementById('options-buttons');

        // 親の履歴を表示
        parentText.innerText = history.join(' > ');
        
        // 現在のノードを表示
        currentText.innerText = currentNode.name;

        // ボタンエリアをクリア
        optionsButtons.innerHTML = '';

        if (currentNode.result) {
            // 最終結果
            currentText.classList.add('result-box');
            const retryBtn = document.createElement('button');
            retryBtn.innerText = "リトライ";
            retryBtn.onclick = () => {
                history = [];
                currentText.classList.remove('result-box');
                updateUI(data);
            };
            optionsButtons.appendChild(retryBtn);
        } else {
            // 選択肢の生成
            currentNode.children.forEach(child => {
                const btn = document.createElement('button');
                btn.innerText = child.name;
                btn.onclick = () => {
                    history.push(currentNode.name);
                    updateUI(child);
                };
                optionsButtons.appendChild(btn);
            });
        }
    }

    // 初期化
    updateUI(data);
</script>
</body>
</html>
